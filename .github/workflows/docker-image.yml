name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # The upstream repo and the Alberta Indoor Comfort fork each publish to
    # their own ghcr.io namespace.
    if: github.repository == 'every-app/open-seo' || github.repository == 'albertaindoorcomfort/open-seo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # The image is built once, with its build-time env baked in, and a
      # container must run with the same values (docs/SELF_HOSTING_DOCKER.md).
      # Upstream keeps the Dockerfile defaults, which match compose.yaml. The
      # fork builds the AIC brand; its deploy sets VITE_BRAND=aic and the same
      # VITE_BRAND_SUPPORT_EMAIL as this repository variable (empty if unset).
      # The builder stage runs on the runner's platform, so arm64 emulation
      # covers only the runtime install.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_BRAND=${{ github.repository == 'albertaindoorcomfort/open-seo' && 'aic' || '' }}
            VITE_BRAND_SUPPORT_EMAIL=${{ github.repository == 'albertaindoorcomfort/open-seo' && vars.VITE_BRAND_SUPPORT_EMAIL || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
